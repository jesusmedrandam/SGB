name: Validación

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sgb_test
      DATABASE_SSL: "false"
      FRONTEND_URL: http://localhost:5173
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sgb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate --workspace @sgb/api
      - name: Verificar creación inicial del superadministrador
        run: npm run bootstrap:superadmin --workspace @sgb/api
        env:
          BOOTSTRAP_SUPERADMIN_EMAIL: superadmin-integration@example.test
          BOOTSTRAP_SUPERADMIN_PASSWORD: Clave-superadmin-integracion-2026
          BOOTSTRAP_SUPERADMIN_NAME: Superadministrador de integración
      - run: npm run test:integration --workspace @sgb/api
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
